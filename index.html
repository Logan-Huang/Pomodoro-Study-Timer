<!doctype html>
<html lang="en" data-reduced-motion="false">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aura — Study Timer</title>
  <meta name="description" content="Aura is a calm, beautiful study timer: Pomodoro cycles, a flexible countdown timer, and a Google Calendar schedule that plans focus sessions around your day.">
  <meta name="theme-color" id="meta-theme-color" content="#05040a">
  <meta name="color-scheme" content="dark">
  <link rel="icon" id="favicon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23a78bfa'/%3E%3Cstop offset='.55' stop-color='%2322d3ee'/%3E%3Cstop offset='1' stop-color='%23f472b6'/%3E%3C/linearGradient%3E%3Cfilter id='b' x='-30%25' y='-30%25' width='160%25' height='160%25'%3E%3CfeGaussianBlur stdDeviation='2.4'/%3E%3C/filter%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%2305040a'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='url(%23g)' stroke-width='6' opacity='.55' filter='url(%23b)'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='url(%23g)' stroke-width='5' stroke-linecap='round' stroke-dasharray='96 24' transform='rotate(-90 32 32)'/%3E%3Ccircle cx='32' cy='32' r='8' fill='none' stroke='url(%23g)' stroke-width='3.5' stroke-linecap='round' stroke-dasharray='34 16' transform='rotate(70 32 32)'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@200;300;400;500&family=Instrument+Serif:ital@0;1&display=swap">

  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/fx.css">
  <link rel="stylesheet" href="styles/timer.css">
  <link rel="stylesheet" href="styles/schedule.css">
  <link rel="stylesheet" href="styles/panels.css">
  <link rel="stylesheet" href="styles/settings.css">
</head>
<body>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <canvas id="fx-canvas" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>

  <div id="app" class="app is-booting" data-mode="pomodoro" data-phase="focus" data-status="idle" data-running="false" data-zen="false" data-panel="" data-calendar="disconnected">
    <header class="topbar">
      <div class="topbar__start">
      <a class="brand" href="./" aria-label="Aura home">
        <svg class="brand__mark" width="28" height="28" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="brand-g1" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
              <stop offset="0" style="stop-color:var(--accent)"/>
              <stop offset="1" style="stop-color:var(--accent-2)"/>
            </linearGradient>
            <linearGradient id="brand-g2" x1="28" y1="4" x2="4" y2="28" gradientUnits="userSpaceOnUse">
              <stop offset="0" style="stop-color:var(--accent-3)"/>
              <stop offset="1" style="stop-color:var(--accent)"/>
            </linearGradient>
          </defs>
          <path d="M16 3.5a12.5 12.5 0 1 1-12.5 12.5" stroke="url(#brand-g1)" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M16 10a6 6 0 1 0 6 6" stroke="url(#brand-g2)" stroke-width="2.6" stroke-linecap="round"/>
        </svg>
        <span class="brand__word">aura</span>
      </a>
      <button class="clock" id="clock" type="button"></button>
      </div>

      <nav id="mode-switch" class="mode-switch" role="tablist" aria-label="Mode">
        <button class="mode-switch__btn" role="tab" data-mode="pomodoro" aria-selected="true"><span>Pomodoro</span></button>
        <button class="mode-switch__btn" role="tab" data-mode="timer" aria-selected="false"><span>Timer</span></button>
        <button class="mode-switch__btn" role="tab" data-mode="schedule" aria-selected="false"><span>Schedule</span></button>
        <span class="mode-switch__indicator" aria-hidden="true"></span>
      </nav>

      <div class="topbar__actions">
        <button class="btn-icon" type="button" data-open-panel="tasks" aria-label="Tasks"></button>
        <button class="btn-icon" type="button" data-open-panel="stats" aria-label="Insights"></button>
        <button class="btn-icon" type="button" data-open-panel="sound" aria-label="Soundscapes"></button>
        <button class="btn-icon" type="button" data-open-panel="settings" aria-label="Settings"></button>
        <button class="btn-icon" type="button" id="btn-zen" aria-label="Zen mode"></button>
        <button class="btn-icon" type="button" id="btn-fullscreen" aria-label="Fullscreen"></button>
      </div>
    </header>

    <main class="stage">
      <div class="stage__main">
        <section id="timer-root" class="timer-root" aria-label="Timer"></section>
        <div class="stage__meta">
          <div id="current-task" class="current-task"></div>
          <div id="calendar-pill" class="calendar-pill"></div>
        </div>
      </div>
      <aside id="schedule-root" class="schedule-root glass" aria-label="Today's schedule"></aside>
    </main>

    <div id="scrim" class="scrim"></div>

    <aside class="panel glass glass--strong" id="panel-tasks" data-panel="tasks" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="panel-tasks-title">
      <header class="panel__header"><h2 id="panel-tasks-title" class="panel__title">Tasks</h2><button class="btn-icon btn-icon--sm" type="button" data-close-panel aria-label="Close"></button></header>
      <div class="panel__body" id="tasks-root"></div>
    </aside>

    <aside class="panel glass glass--strong" id="panel-stats" data-panel="stats" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="panel-stats-title">
      <header class="panel__header"><h2 id="panel-stats-title" class="panel__title">Insights</h2><button class="btn-icon btn-icon--sm" type="button" data-close-panel aria-label="Close"></button></header>
      <div class="panel__body" id="stats-root"></div>
    </aside>

    <aside class="panel glass glass--strong" id="panel-sound" data-panel="sound" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="panel-sound-title">
      <header class="panel__header"><h2 id="panel-sound-title" class="panel__title">Soundscapes</h2><button class="btn-icon btn-icon--sm" type="button" data-close-panel aria-label="Close"></button></header>
      <div class="panel__body" id="sound-root"></div>
    </aside>

    <aside class="panel glass glass--strong" id="panel-settings" data-panel="settings" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="panel-settings-title">
      <header class="panel__header"><h2 id="panel-settings-title" class="panel__title">Settings</h2><button class="btn-icon btn-icon--sm" type="button" data-close-panel aria-label="Close"></button></header>
      <div class="panel__body" id="settings-root"></div>
    </aside>

    <div id="shortcuts-overlay" class="shortcuts-overlay" hidden></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
  </div>

  <noscript>
    <div style="position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;background:#05040a;color:#f5f3ff;font-family:system-ui,sans-serif;text-align:center">
      <p>Aura needs JavaScript to run. Please enable it and reload.</p>
    </div>
  </noscript>

  <script type="module" src="src/main.js"></script>
</body>
</html>
